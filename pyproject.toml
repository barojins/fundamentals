[project]
name = "fundamentals"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["check.py", "python"]
